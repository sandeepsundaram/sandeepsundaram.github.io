<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sandeep Sundaram — Engineering Leader & Cofounder</title>

  <!-- Theme bootstrap: runs before paint to avoid FOUC -->
  <script>
    (function () {
      try {
        var stored = localStorage.getItem('theme');
        var prefersLight = window.matchMedia('(prefers-color-scheme: light)').matches;
        var theme = stored || (prefersLight ? 'light' : 'dark');
        document.documentElement.dataset.theme = theme;
      } catch (e) {
        document.documentElement.dataset.theme = 'dark';
      }
    })();
  </script>

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap"
    rel="stylesheet"
  />

  <!-- Lucide icons -->
  <script src="https://unpkg.com/lucide@latest" defer></script>

  <style>
    /* === Reset === */
    *, *::before, *::after { box-sizing: border-box; }
    * { margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body {
      font-family: 'Inter', system-ui, -apple-system, Segoe UI, sans-serif;
      line-height: 1.65;
      background: var(--bg);
      color: var(--text);
      -webkit-font-smoothing: antialiased;
      transition: background 0.3s ease, color 0.3s ease;
    }
    a { color: inherit; text-decoration: none; }
    img { max-width: 100%; display: block; }
    button { font: inherit; cursor: pointer; background: none; border: 0; color: inherit; }

    /* === Theme variables === */
    :root {
      --accent: #6366f1;
      --accent-2: #a855f7;
      --accent-grad: linear-gradient(135deg, #6366f1 0%, #a855f7 100%);
      --mono: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
      --radius: 6px;
      --radius-lg: 12px;
      --container: 1200px;
      --section-y: clamp(64px, 10vw, 120px);
    }

    [data-theme='dark'] {
      --bg: #0a0a0b;
      --surface: #15151a;
      --surface-2: #1f1f23;
      --border: #2a2a30;
      --text: #ededed;
      --text-muted: #9999a3;
      --grain: 0.04;
    }

    [data-theme='light'] {
      --bg: #ffffff;
      --surface: #f5f5f7;
      --surface-2: #ededf0;
      --border: #e5e5ea;
      --text: #111114;
      --text-muted: #5e5e66;
      --grain: 0.02;
    }

    /* === Layout helpers === */
    .container {
      max-width: var(--container);
      margin: 0 auto;
      padding: 0 24px;
    }

    .section {
      padding: var(--section-y) 0;
    }

    /* === Accessibility helpers === */
    .skip-link {
      position: absolute;
      left: -9999px;
      top: 0;
      padding: 12px 16px;
      background: var(--accent);
      color: white;
      border-radius: var(--radius);
      z-index: 1000;
    }
    .skip-link:focus { left: 16px; top: 16px; }

    :focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 3px;
      border-radius: 2px;
    }

    /* === Reduced motion === */
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.001ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.001ms !important;
        scroll-behavior: auto !important;
      }
    }
  </style>
</head>

<body>
  <a class="skip-link" href="#main">Skip to content</a>

  <main id="main">
    <div class="container">
      <h1>Sandeep Sundaram</h1>
      <p>Scaffold in progress.</p>
    </div>
  </main>

  <script>
    // Initialize Lucide icons after DOM is ready
    document.addEventListener('DOMContentLoaded', function () {
      if (window.lucide) window.lucide.createIcons();
    });
  </script>
</body>
</html>
